# Gera o NitroControl-Setup.exe numa maquina Windows do GitHub (o IExpress so existe no Windows)
# e coloca o arquivo no Release escolhido, substituindo o que estiver la.
# Se o Release ainda nao existir, ele e criado no commit atual, com as notas de .github/release-notes/<tag>.md.
name: Gerar Setup

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do Release que vai receber o Setup'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar NitroControl-Setup.exe
        shell: powershell
        run: ./build.ps1

      - name: Criar o Release se ainda nao existir
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes=".github/release-notes/$TAG.md"
            if [ -f "$notes" ]; then extra=(--notes-file "$notes"); else extra=(--notes ""); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NitroControl $TAG" "${extra[@]}"
          fi

      - name: Enviar para o Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" NitroControl-Setup.exe --clobber --repo "${{ github.repository }}"
